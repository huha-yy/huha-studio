<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"stepNum","type":"string","label":"步骤号","default":"STEP 02"},
  {"id":"stepTitle","type":"string","label":"步骤名","default":"图生视频"},
  {"id":"accent","type":"color","label":"强调色(蓝)","default":"#2b6ea0"},
  {"id":"paper","type":"color","label":"纸底","default":"#f5f2ea"},
  {"id":"promptText","type":"string","label":"提示词","default":"轻微眨眼，嘴角上扬"},
  {"id":"caption","type":"string","label":"底注","default":"微动作最出效果，大幅动作容易穿帮"},
  {"id":"endHold","type":"number","label":"结尾停留","default":1.2,"min":0,"max":5,"step":0.1,"group":"节奏"}
]'>
<head>
<meta charset="utf-8">
<title>S3 · STEP 2 图生视频</title>
<script src="vendor/gsap.min.js"></script>
<style id="om-fonts">
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-500.woff") format("woff"); font-weight: 500; font-style: normal; }
@font-face { font-family: "Noto Sans SC"; src: url("assets/fonts/NotoSansSC-900.woff") format("woff"); font-weight: 900; font-style: normal; }
</style>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  #film { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--paper); color: #2e2620; font-family: "Noto Sans SC", sans-serif; font-weight: 500; }
  .paper-tex { position: absolute; inset: 0; background:
      radial-gradient(1000px 600px at 15% 8%, #ffffff90, transparent 60%),
      radial-gradient(800px 500px at 95% 96%, #00000008, transparent 60%); }

  .step { position: absolute; left: 90px; top: 170px; display: flex; align-items: center; gap: 34px; }
  .step .bar { width: 18px; height: 150px; background: var(--accent); }
  .step .col { display: flex; flex-direction: column; gap: 10px; }
  .step .num { font-size: 34px; letter-spacing: 12px; color: var(--accent); }
  .step .name { font-size: 96px; font-weight: 900; letter-spacing: 12px; line-height: 1; }

  /* 工具窗口卡 */
  .win { position: absolute; left: 90px; top: 430px; width: 900px; height: 1000px;
      background: #fdfaf3; border-radius: 20px; box-shadow: 0 8px 44px #38281f22; }
  .titlebar { display: flex; align-items: center; gap: 14px; padding: 26px 32px; border-bottom: 3px solid #eadfcb; }
  .dot { width: 20px; height: 20px; border-radius: 50%; background: #d8cbb8; }
  .titlebar .t { margin-left: 14px; font-size: 34px; letter-spacing: 4px; color: #6f6252; }

  .duo { position: absolute; left: 36px; top: 120px; width: 828px; height: 430px; display: flex; align-items: center; justify-content: space-between; }
  .frame { position: relative; width: 330px; height: 430px; border-radius: 14px; overflow: hidden; background: #e8d5b5; box-shadow: 0 4px 18px #38281f1e; }
  .arrow { font-size: 70px; color: var(--accent); font-weight: 900; }
  .lbl { position: absolute; left: 0; right: 0; bottom: 0; background: #38281fd9; color: #f5f2ea; font-size: 27px; letter-spacing: 6px; text-align: center; padding: 12px 0; }

  .promptbox { position: absolute; left: 36px; top: 600px; width: 828px; height: 150px;
      border: 3px solid #d8cbb8; border-radius: 14px; background: #f5f2ea; padding: 20px 28px;
      font-size: 46px; letter-spacing: 3px; box-sizing: border-box; }
  .promptbox .placeholder { color: #8a7c68; }
  .caret { display: inline-block; width: 5px; height: 46px; background: var(--accent); margin-left: 6px; vertical-align: -6px; }

  .row { position: absolute; left: 36px; top: 790px; width: 828px; display: flex; align-items: center; gap: 26px; }
  .btn { padding: 20px 46px; border-radius: 12px; background: var(--accent); color: #f5f2ea; font-size: 38px; letter-spacing: 6px; }
  .prog { flex: 1; height: 16px; border-radius: 8px; background: #e2d7c4; overflow: hidden; }
  .prog .fill { height: 100%; transform-origin: 0 50%; transform: scaleX(0); background: var(--accent); }
  .pct { width: 130px; font-size: 36px; text-align: right; color: #4d443a; font-variant-numeric: tabular-nums; }

  .done { position: absolute; left: 36px; top: 910px; font-size: 34px; letter-spacing: 4px; color: #1f7a4d; opacity: 0; }

  .caption { position: absolute; left: 0; right: 0; bottom: 150px; text-align: center; font-size: 50px; letter-spacing: 6px; opacity: 0; }
</style>
</head>
<body>
<div id="film" data-composition-id="film" data-width="1080" data-height="1920" data-duration="8">
  <div class="paper-tex"></div>

  <div class="step" data-om-id="step">
    <div class="bar" data-om-id="step-bar"></div>
    <div class="col">
      <div class="num" data-om-id="step-num" data-var-text="stepNum">STEP 02</div>
      <div class="name" data-om-id="step-name" data-var-text="stepTitle">图生视频</div>
    </div>
  </div>

  <div class="win" data-om-id="tool-window">
    <div class="titlebar" data-om-id="titlebar">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <span class="t">AI 老照片 · 动起来</span>
    </div>

    <div class="duo" data-om-id="duo">
      <div class="frame" data-om-id="input-photo">
        <svg viewBox="0 0 330 430" width="330" height="430">
          <rect width="330" height="430" fill="#e8d5b5"/>
          <ellipse cx="165" cy="400" rx="150" ry="34" fill="#b39a74"/>
          <g fill="#8a6a52">
            <circle cx="165" cy="150" r="58"/>
            <path d="M165 220 C95 220 80 320 84 430 L246 430 C250 320 235 220 165 220 Z"/>
          </g>
        </svg>
        <div class="lbl">照 片</div>
      </div>
      <div class="arrow" data-om-id="arrow">→</div>
      <div class="frame" data-om-id="preview">
        <svg viewBox="0 0 330 430" width="330" height="430">
          <rect width="330" height="430" fill="#e8d5b5"/>
          <ellipse cx="165" cy="400" rx="150" ry="34" fill="#b39a74"/>
          <g fill="#8a6a52">
            <circle cx="165" cy="150" r="58"/>
            <path d="M165 220 C95 220 80 320 84 430 L246 430 C250 320 235 220 165 220 Z"/>
          </g>
          <g id="eyes" data-om-id="eyes">
            <rect x="130" y="142" width="26" height="5" rx="2.5" fill="#4a3a2c"/>
            <rect x="176" y="142" width="26" height="5" rx="2.5" fill="#4a3a2c"/>
          </g>
          <path id="mouth-flat" data-om-id="mouth-flat" d="M148 190 Q165 194 182 190" stroke="#4a3a2c" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path id="mouth-smile" data-om-id="mouth-smile" d="M146 188 Q165 202 184 188" stroke="#4a3a2c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0"/>
        </svg>
        <div class="lbl">生 成 结 果</div>
      </div>
    </div>

    <div class="promptbox" data-om-id="promptbox">
      <span class="placeholder" id="ph">写一句提示词，比如：轻微眨眼，嘴角上扬</span><span id="pt" style="display:none"></span><span class="caret" data-om-id="caret"></span>
    </div>

    <div class="row" data-om-id="row">
      <span class="btn" data-om-id="btn">生成视频</span>
      <span class="prog"><span class="fill" data-om-id="prog-fill"></span></span>
      <span class="pct" id="pct">0%</span>
    </div>

    <div class="done" data-om-id="done">✓ 生成完成 · 循环播放中</div>
  </div>

  <div class="caption" data-om-id="caption" data-om-var="caption">微动作最出效果，大幅动作容易穿帮</div>
</div>

<script>
  const V = OM.vars();
  const tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  const promptEl = document.getElementById('pt');
  const phEl = document.getElementById('ph');
  const typer = { n: 0 };
  const pctEl = document.getElementById('pct');
  const pct = { v: 0 };

  tl.addLabel('scene:enter', 0)
    .fromTo('.win', { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: .7, ease: 'expo.out' }, .1)
    .fromTo('.step .bar', { scaleY: 0 }, { scaleY: 1, duration: .5, transformOrigin: '50% 0' }, .2)
    .fromTo('.step .num', { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: .5 }, .3)
    .fromTo('.step .name', { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: .6 }, .4)
    .fromTo('.input-photo', { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .6, ease: 'back.out(1.6)' }, .55)
    .fromTo('.arrow', { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: .5 }, .8)
    .fromTo('.preview', { opacity: 0, scale: .9 }, { opacity: 1, scale: 1, duration: .6, ease: 'back.out(1.6)' }, .9);

  tl.addLabel('scene:type', 1.4)
    .call(() => { phEl.style.display = 'none'; promptEl.style.display = 'inline'; }, null, 1.4)
    .fromTo(typer, { n: 0 }, { n: V.promptText.length, duration: 1.5, ease: 'none',
        onUpdate: () => { promptEl.textContent = V.promptText.slice(0, Math.round(typer.n)); } }, 1.45)
    .fromTo('.caret', { opacity: 1 }, { opacity: .15, duration: .4, repeat: 4, yoyo: true, ease: 'steps(1)' }, 1.4);

  tl.addLabel('scene:generate', 3.1)
    .fromTo('.btn', { scale: 1 }, { scale: .94, duration: .12, yoyo: true, repeat: 1, ease: 'power2.in' }, 3.15)
    .fromTo(pct, { v: 0 }, { v: 100, duration: 1.7, ease: 'power2.inOut',
        onUpdate: () => { pctEl.textContent = Math.round(pct.v) + '%'; } }, 3.35)
    .fromTo('.prog .fill', { scaleX: 0 }, { scaleX: 1, duration: 1.7, ease: 'power2.inOut' }, 3.35)
    .fromTo('.done', { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .5 }, 5.0);

  tl.addLabel('scene:preview', 5.2)
    .fromTo('#eyes', { scaleY: 1 }, { scaleY: .12, duration: .1, yoyo: true, repeat: 1, ease: 'power1.inOut', transformOrigin: '50% 142px' }, 5.5)
    .fromTo('#eyes', { scaleY: 1 }, { scaleY: .12, duration: .1, yoyo: true, repeat: 1, ease: 'power1.inOut', transformOrigin: '50% 142px' }, 6.6)
    .fromTo('#mouth-smile', { opacity: 0 }, { opacity: 1, duration: .7 }, 5.7)
    .to('#mouth-flat', { opacity: 0, duration: .7 }, 5.7)
    .fromTo('.preview svg', { scale: 1 }, { scale: 1.06, duration: 2.6, ease: 'power1.inOut', transformOrigin: '50% 40%' }, 5.3)
    .fromTo('.caption', { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: .8 }, 5.9)
    .fromTo('.arrow', { x: 0 }, { x: 12, duration: .8, yoyo: true, repeat: 2, ease: 'sine.inOut' }, 6.2)
    .to({}, { duration: V.endHold });

  window.__timelines['film'] = tl;
</script>
</body>
</html>
