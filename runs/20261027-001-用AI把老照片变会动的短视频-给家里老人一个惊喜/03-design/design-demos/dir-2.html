<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1080px; height:1920px; overflow:hidden; }
  body { font-family:"Noto Serif CJK SC",serif; background:#fff; position:relative; }
  .scene { height:1210px; position:relative; overflow:hidden;
    background:radial-gradient(circle at 54% 42%, #f3cf8e 0%, #d8a468 14%, #6b503c 48%, #38281f 78%, #241811 100%); }
  /* 窗光斜切 */
  .beam { position:absolute; top:-80px; left:520px; width:300px; height:900px;
    background:linear-gradient(180deg, rgba(255,232,190,.28), rgba(255,232,190,.04));
    transform:rotate(24deg); transform-origin:top left; filter:blur(6px); }
  .bokeh { position:absolute; border-radius:50%; background:rgba(255,216,150,.30); filter:blur(14px); }
  /* 沙发:扶手顶缘一道弱暖光,交代"坐着" */
  .sofa { position:absolute; bottom:-30px; left:90px; width:560px; height:300px; background:#1c1310; border-radius:60px 60px 0 0; box-shadow:inset 0 10px 0 rgba(253,220,160,.12); }
  /* 前景肩膀(过肩):上缘弱屏光,读出"肩膀"而非黑块 */
  .shoulder { position:absolute; bottom:-260px; right:-160px; width:900px; height:620px; background:#160f0b; border-radius:400px 0 0 0; filter:blur(2px); box-shadow:inset 0 14px 60px rgba(253,226,170,.14); }
  /* 奶奶剪影:头+肩,坐在沙发上,面向手机;屏幕光勾出轮廓光 */
  .gm { position:absolute; bottom:110px; left:250px; width:360px; }
  .gm .head { width:150px; height:170px; background:linear-gradient(205deg,#3a281c 0%,#20150f 55%); border-radius:75px 75px 20px 20px; margin-left:60px; position:relative; }
  .gm .head::before { content:""; position:absolute; inset:-10px; border-radius:80px 80px 26px 26px; background:rgba(253,226,170,.42); z-index:-1; transform:translate(14px,10px); filter:blur(4px); }
  .gm .bun { position:absolute; top:-38px; left:118px; width:64px; height:64px; background:#20150f; border-radius:50%; }
  .gm .bun::before { content:""; position:absolute; inset:-7px; border-radius:50%; background:rgba(253,226,170,.34); z-index:-1; transform:translate(8px,6px); filter:blur(3px); }
  .gm .torso { width:360px; height:220px; background:linear-gradient(195deg,#33241a 0%,#160f0b 70%); border-radius:90px 90px 0 0; margin-top:-14px; }
  /* 手与手机:全画面唯一亮源 */
  .phone { position:absolute; bottom:330px; left:420px; width:150px; height:250px; background:#fdf3dc; border-radius:14px;
    box-shadow:0 0 60px 24px rgba(253,233,186,.55), 0 0 160px 70px rgba(253,233,186,.28); transform:rotate(-6deg); }
  .phone .pic { position:absolute; top:26px; left:19px; width:112px; height:138px; background:#fffdf4; box-shadow:0 2px 6px rgba(120,90,40,.25); }
  .phone .pic .fig { position:absolute; top:16px; left:26px; width:60px; height:74px; border-radius:30px 30px 8px 8px; background:linear-gradient(180deg,#cbb392,#a98c5f); filter:blur(1px); }
  .arm { position:absolute; bottom:150px; left:280px; width:340px; height:84px; background:#1a120d; border-radius:44px; transform:rotate(-16deg); }
  .hand { position:absolute; bottom:296px; left:512px; width:112px; height:86px; background:#241812; border-radius:22px; transform:rotate(-6deg); }
  .hand::before { content:""; position:absolute; right:-8px; bottom:-8px; width:70px; height:26px; background:#241812; border-radius:14px; }
  .text { position:absolute; top:1210px; left:0; right:0; bottom:0; padding:96px 100px 0; }
  .talk { font-size:88px; font-weight:900; color:#2e2620; line-height:1.62; letter-spacing:4px; }
  .talk em { font-style:normal; color:#c2492b; }
  .tagline { margin-top:64px; display:flex; align-items:center; gap:30px; }
  .tagline .line { width:60px; height:3px; background:#2e2620; }
  .tagline span { font-family:"Noto Sans CJK SC",sans-serif; font-size:32px; color:#9b8b76; letter-spacing:10px; }
  .meta { position:absolute; bottom:170px; left:100px; right:100px; display:flex; justify-content:space-between; font-family:"Noto Sans CJK SC",sans-serif; font-size:28px; color:#c0b4a2; letter-spacing:8px; }
</style>
</head>
<body>
  <div class="scene">
    <div class="beam"></div>
    <div class="bokeh" style="width:120px;height:120px;left:120px;top:180px;"></div>
    <div class="bokeh" style="width:70px;height:70px;left:680px;top:120px;"></div>
    <div class="bokeh" style="width:180px;height:180px;left:320px;top:420px;background:rgba(255,236,196,.22)"></div>
    <div class="sofa"></div>
    <div class="gm"><div class="head"><div class="bun"></div></div><div class="torso"></div></div>
    <div class="arm"></div>
    <div class="hand"></div>
    <div class="phone"><div class="pic"><div class="fig"></div></div></div>
    <div class="shoulder"></div>
  </div>
  <div class="text">
    <div class="talk">你家抽屉里,<br>是不是也有<em>这样一张</em>?</div>
    <div class="tagline"><div class="line"></div><span>AI 让老照片活过来 · 45 秒</span></div>
  </div>
  <div class="meta"><span>老照片修复</span><span>图生视频</span><span>亲情短片</span></div>
</body>
</html>
